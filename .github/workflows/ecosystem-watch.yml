name: ecosystem-watch

# Monthly automated probe of research.md's decay-watchlist item 2 (ecosystem
# whitespace). Two red-light layers, one early-warning layer:
#
#   RED    flagship-framework directories (anthropics / superpowers /
#          addyosmani) -- a README-craft skill here expires the claim
#   RED    high-star skill hubs (awesome-llm-apps, taste-skill, archify,
#          last30days-skill) -- same semantics: adoption at scale
#   RED    flagship-framework / high-star skill-hub directories (adoption
#          at scale expires the claim) OR code-search baseline surge: the
#          2026-10-28 first code sweep found 10 embedded README skills in
#          project .claude/.agents dirs (remix-run write-readme et al.) --
#          they exist, so the claim is scoped to frameworks+discipline, and
#          a >50% surge over that baseline red-lights "adoption accelerating"
#   WARN   name/description search hits (topic:agent-skills + readme),
#          any star count -- printed as early warning only
#
# A red light means the differentiation claim has expired and positioning
# needs rework -- not that anything is broken. Known limitation: top-level
# entry names only; a skill named to dodge /readme/ slips past (accepted for
# an early-warning probe).

on:
  schedule:
    - cron: "23 5 3 * *" # monthly, 3rd day, 05:23 UTC
  workflow_dispatch: {}

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: scan frameworks, skill hubs, and repo search for README-class skills
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'EOF'
          import json, os, re, sys, urllib.parse, urllib.request

          FRAMEWORKS = {
              "anthropics/skills": ["skills", "commands"],
              "obra/superpowers": ["skills"],
              "addyosmani/agent-skills": ["agents", "commands", "skills"],
          }
          SKILL_HUBS = {
              "Shubhamsaboo/awesome-llm-apps": ["agents", "skills", "commands"],
              "Leonxlnx/taste-skill": ["skills", "agents"],
              "tt-a1i/archify": ["skills", "agents", "commands"],
              "mvanhorn/last30days-skill": ["skills", "agents"],
          }
          RED_STAR_FLOOR = 500
          # 2026-10-28 first full sweep: code search total_count = 8152 embedded
          # README skills (a first draft read only the per_page items and
          # mistook 10 samples for the population -- always read total_count).
          # Sampled three: style-clone / supervisor / structure-template types;
          # none carry claim tiers, gates, or bilingual discipline.
          CODE_BASELINE = 8152
          SURGE = 1.5
          NAME_RE = re.compile(r"read.?me", re.IGNORECASE)
          headers = {
              "Accept": "application/vnd.github+json",
              "User-Agent": "readme-anatomy-ecosystem-watch",
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
          }

          def api(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)
          hits, warned, scanned = [], [], 0

          for label, repos in (("flagship framework", FRAMEWORKS),
                               ("skill hub", SKILL_HUBS)):
              for repo, dirs in repos.items():
                  for d in dirs:
                      try:
                          entries = api(f"https://api.github.com/repos/{repo}/contents/{d}")
                      except Exception as e:
                          print(f"note: {repo}/{d} unreachable ({e}); skipped")
                          continue
                      if not isinstance(entries, list):
                          continue
                      for entry in entries:
                          name = entry.get("name", "")
                          scanned += 1
                          if NAME_RE.search(name) and name.lower() != "readme.md":
                              hits.append(f"[red:{label}] {repo}/{d}/{name}")

          # baseline tracking: embedded README skills exist (they are project-
          # local, not framework skills); red only on a surge over baseline
          code_hits = []
          try:
              q = urllib.parse.quote("filename:SKILL.md readme in:path")
              found = api(f"https://api.github.com/search/code?q={q}&per_page=30")
              for item in found.get("items", []):
                  repo = item["repository"]["full_name"]
                  scanned += 1
                  code_hits.append(f"{repo}/{item.get('path', '?')}")
              total = found.get("total_count", len(code_hits))
              print(f"note: code search finds {total} embedded README skills "
                    f"(baseline {CODE_BASELINE}, 2026-10-28)")
              for c in code_hits[:5]:
                  print(f"  sample: {c}")
              if total > CODE_BASELINE * SURGE:
                  hits.append(f"[red:code surge] {total} embedded README skills "
                              f"vs baseline {CODE_BASELINE} -- adoption accelerating")
          except Exception as e:
              print(f"note: code search failed ({e}); code layer skipped this run")

          # WARN only: name/description resonance, any star count
          try:
              q = urllib.parse.quote("topic:agent-skills readme in:name,description")
              found = api(f"https://api.github.com/search/repositories?q={q}"
                          f"&sort=stars&order=desc&per_page=10")
              for item in found.get("items", []):
                  full, stars = item["full_name"], item.get("stargazers_count", 0)
                  warned.append(f"[warn:search] {full} ({stars} stars) "
                                f"-- name/description resonance only, no SKILL.md evidence")
          except Exception as e:
              print(f"note: repo search failed ({e}); warn layer skipped this run")

          print(f"scanned {scanned} entries across {len(FRAMEWORKS)} frameworks, "
                f"{len(SKILL_HUBS)} skill hubs, code search, and the warn search")
          for w in warned:
              print(f"  {w}")
          if hits:
              print("README-craft skill detected -- whitespace claim expired:")
              for h in hits:
                  print(f"  {h}")
              sys.exit(1)
          print("no README-class skill found; whitespace holds "
                f"({len(warned)} early-warning note(s) above)")
          EOF
